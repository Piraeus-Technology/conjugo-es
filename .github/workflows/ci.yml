name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 matches local dev; on 22 the jest-expo "winter" runtime
          # polyfill getters throw "import outside of the scope" in ui tests.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests and meaningful coverage
        run: npm run coverage
      - name: Verb example audit
        run: npm run audit:examples
      - name: Expo project health
        run: npx expo-doctor
        env:
          # Jest 30 and eslint-config-expo 56 are deliberate exceptions in
          # this SDK 54 branch; all other doctor checks still run.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1
